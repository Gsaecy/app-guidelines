<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组件画廊 — App Guidelines</title>
<meta name="description" content="28 个 App UI 组件规范与可交互样例：按钮、输入、选择、导航、表格、反馈、空状态，含尺寸、状态与间距标注。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>

<header class="appbar">
  <div class="brand">
    <div class="brand__mark" aria-hidden="true">A</div>
    <div class="brand__name">App Guidelines</div>
    <div class="brand__tag">组件画廊</div>
  </div>
  <div class="appbar__spacer"></div>
  <nav class="topnav" aria-label="站点导航">
    <a href="index.html">规范速查</a>
    <a href="principles.html">设计原理</a>
    <a href="elements.html">元素总览</a>
    <a href="components.html">组件画廊</a>
    <a href="blueprint.html">产品蓝图</a>
    <a href="testing.html">测试工具</a>
  </nav>
  <div class="appbar__actions">
    <button class="icon-btn" id="themeToggle" type="button" aria-label="切换深浅色">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.8v2.1M12 19.1v2.1M4.5 4.5l1.5 1.5M18 18l1.5 1.5M2.8 12h2.1M19.1 12h2.1M4.5 19.5 6 18M18 6l1.5-1.5"></path>
      </svg>
    </button>
  </div>
</header>

<div class="wrap">
  <main class="main" id="main">

    <div class="page-head">
      <div class="hero__eyebrow">Components · 可直接对照实现</div>
      <h1>组件画廊</h1>
      <p>29 个组件，每个都给出可交互样例与规格标注（高度、圆角、内边距、状态）。顶部工具条可切换密度与圆角，观察同一组件在不同系统下的形态差异。</p>
      <div class="subnav" id="compSubnav"></div>
    </div>

    <div class="gallery-toolbar">
      <div class="segmented" id="densitySwitch" role="group" aria-label="密度">
        <button type="button" data-density="compact">紧凑 32</button>
        <button type="button" class="is-on" data-density="regular">标准 40</button>
        <button type="button" data-density="spacious">宽松 48</button>
      </div>
      <div class="segmented" id="radiusSwitch" role="group" aria-label="圆角">
        <button type="button" data-radius="4">Windows 4px</button>
        <button type="button" data-radius="8">8px</button>
        <button type="button" class="is-on" data-radius="10">Apple 10px</button>
      </div>
      <label class="check"><input type="checkbox" id="showStateGrid">显示状态对比</label>
      <span class="card__hint" id="galleryCount"></span>
    </div>

    <div class="comp-grid" id="compGrid"></div>

    <div class="footer">
      <span>App Guidelines · 组件画廊</span>
      <span><a href="index.html">规范速查</a> · <a href="testing.html">测试工具</a></span>
    </div>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/shell.js"></script>
<script src="assets/components.js"></script>
</body>
</html>
