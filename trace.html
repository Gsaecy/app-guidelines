<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>切割草稿生成器 — App Guidelines</title>
<link rel="stylesheet" href="assets/style.css?v=20260212d">
<style>
  .tx-wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 60px; }
  .tx-head { padding: 28px 0 8px; }
  .tx-head h1 { font-size: 26px; margin: 0 0 6px; }
  .tx-head p { margin: 0; color: var(--text-2); font-size: 13px; }
  .tx-grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; margin-top: 18px; }
  @media (max-width: 860px) { .tx-grid { grid-template-columns: 1fr; } }
  #traceDrop { border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 22px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  #traceDrop:hover, #traceDrop.is-over { border-color: var(--accent); background: var(--accent-soft); }
  #traceDrop .tx-up { font-size: 12.5px; color: var(--text-2); }
  #traceDrop .tx-up b { display: block; font-size: 14px; color: var(--text); margin-bottom: 4px; }
  .trace-status { margin-top: 10px; font-size: 12px; padding: 7px 10px; border-radius: 8px; background: var(--line); color: var(--text-2); }
  .trace-status.is-ok { background: rgba(14,159,110,.12); color: #0B7A55; }
  .trace-status.is-err { background: rgba(215,0,21,.10); color: #B00020; }
  .trace-thumb { display: block; max-width: 100%; max-height: 116px; margin: 0 auto 8px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; object-fit: contain; }
  .trace-progress { margin-top: 10px; }
  .trace-progress__bar { height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .trace-progress__bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .18s ease; }
  .trace-progress__label { margin-top: 6px; font-size: 11.5px; color: var(--text-2); }
  .tx-actions { display: grid; gap: 8px; margin-top: 14px; }
  .tx-actions .btn { width: 100%; }
  .tx-actions .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none; }
  #traceStage { min-height: 300px; display: flex; align-items: center; justify-content: center; background: var(--bg-2, #f5f6f8); border-radius: 10px; padding: 10px; }
  #traceStage svg { width: 100%; height: auto; display: block; }
  #traceFamily { margin: 0 0 10px; }
  .rfam { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .rfam__item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .rfam__lab { font: 600 11px/1.2 ui-monospace, monospace; color: var(--text-2); }
  .rfam__lab b { display: block; font-weight: 400; color: var(--text-3); }
  .tx-info { font-size: 12px; color: var(--text-2); }
  details.tx-adv { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.tx-adv summary { font-size: 12.5px; color: var(--text-2); cursor: pointer; }
  details.tx-adv .body { display: grid; gap: 10px; margin-top: 12px; }
  .tx-field span { display: block; font-size: 11.5px; color: var(--text-2); margin-bottom: 4px; }
</style>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>

<header class="appbar">
  <div class="brand"><div class="brand__mark" aria-hidden="true">A</div><div class="brand__name">App Guidelines</div><div class="brand__tag">切割生成器</div></div>
  <div class="appbar__spacer"></div>
  <nav class="topnav" aria-label="站点导航">
    <a href="index.html">规范速查</a><a href="principles.html">设计原理</a><a href="elements.html">元素总览</a>
    <a href="components.html">组件画廊</a><a href="blueprint.html">产品蓝图</a><a href="logo.html">Logo 规范</a>
    <a href="icons.html">图标库</a><a href="devices.html">设备示例</a><a href="trace.html" class="is-on">切割生成器</a><a href="testing.html">测试工具</a>
  </nav>
  <div class="appbar__actions"><button class="icon-btn" id="themeToggle" type="button" aria-label="切换深浅色">◐</button></div>
</header>

<main id="main" class="tx-wrap">
  <div class="tx-head">
    <h1>切割草稿生成器</h1>
    <p>上传图形 → 处理 → 导出矢量。图片只在本地处理，不上传服务器。</p>
  </div>

  <div class="tx-grid">
    <div class="card">
      <div id="traceDrop">
        <div class="tx-up"><b>选择图片</b>点击或拖入 · Ctrl/⌘+V 粘贴</div>
      </div>
      <input type="file" id="traceFile" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml,image/avif" hidden>
      <div id="traceStatus" class="trace-status" role="status" aria-live="polite">还没有选择图片</div>

      <div class="tx-actions">
        <button class="btn btn--primary" type="button" id="traceRun" disabled>开始处理</button>
        <button class="btn btn--primary" type="button" id="dlAiQuick" disabled>导出 SVG（含构造层）</button>
        <div class="row">
          <button class="btn btn--secondary" type="button" id="dlSvg" disabled>SVG</button>
          <button class="btn btn--secondary" type="button" id="dlAi" disabled>PDF</button>
          <button class="btn btn--secondary" type="button" id="dlPng" disabled>PNG</button>
        </div>
      </div>

      <div id="traceProgressWrap" class="trace-progress" hidden>
        <div class="trace-progress__bar"><i id="traceProgressFill"></i></div>
        <div class="trace-progress__label" id="traceProgressLabel"></div>
      </div>

      <details class="tx-adv">
        <summary>高级参数</summary>
        <div class="body">
          <label class="tx-field">
            <span>颜色容差 <code id="thVal">128</code></span>
            <input type="range" id="traceThreshold" min="20" max="240" value="128" style="width:100%">
          </label>
          <label class="tx-field">
            <span>节点简化 <code id="spVal">2.2</code></span>
            <input type="range" id="traceSimplify" min="0.4" max="8" step="0.2" value="2.2" style="width:100%">
          </label>
          <label class="check"><input type="checkbox" id="traceInvert">反转前景 / 背景</label>
          <label class="check"><input type="checkbox" id="traceGuides" checked>网格辅助线</label>
          <label class="check"><input type="checkbox" id="traceFit" checked>直线 / 圆弧拟合</label>
          <label class="check"><input type="checkbox" id="traceConstruct">构造圆</label>
          <label class="tx-field">
            <span>模数网格</span>
            <select id="traceGrid" style="width:100%;padding:4px 8px;border-radius:6px;border:1px solid var(--line-strong);background:var(--card);color:inherit">
              <option value="8">8a</option><option value="12" selected>12a</option><option value="16">16a</option><option value="24">24a</option>
            </select>
          </label>
          <label class="tx-field">
            <span>成品颜色</span>
            <input type="color" id="traceColor" value="#0071E3" style="width:100%;height:32px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card)">
          </label>
          <button class="btn btn--secondary btn--sm" type="button" id="traceDemoLeaf">示例 · 叶片</button>
          <button class="btn btn--secondary btn--sm" type="button" id="traceDemoRing">示例 · 圆环</button>
        </div>
      </details>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px">
        <b style="font-size:14px">预览</b>
        <span class="tx-info" id="traceInfo">尚未处理</span>
      </div>
      <div id="traceFamily"></div>
      <div id="traceStage"><span style="font-size:12px;color:var(--text-3)">处理后在这里显示矢量草稿</span></div>
    </div>
  </div>

  <div class="footer" style="margin-top:26px">
    <span>App Guidelines · 切割生成器</span>
    <span><a href="logo.html">Logo 规范</a> · <a href="icons.html">图标库</a> · <a href="testing.html">测试工具</a></span>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>if(window.AGTrace&&window.AGTrace.version!=="20260212d"){location.replace(location.pathname+"?b="+Date.now())}</script>
<script src="assets/shell.js?v=20260209b"></script>
<script src="assets/trace.js?v=20260212d"></script>
</body>
</html>
